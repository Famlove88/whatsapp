html{height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#root{flex:1 1 0;display:flex;flex-direction:column;min-height:0}
#root>.app-shell{flex:1 1 0;min-height:0;height:auto}
@media (width>=1450px){#root>.app-shell{height:auto}}
#root>.welcome-page{flex:1 1 0;min-height:0;overflow:auto;justify-content:flex-start;justify-content:safe center;-webkit-overflow-scrolling:touch}
#lk-bar{flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;padding:8px 14px;background:#075e54;color:#fff;font-size:14px;line-height:1.5;text-align:center}
#lk-bar[hidden]{display:none}
#lk-bar button{min-height:32px;padding:4px 14px;border-radius:9px;border:1px solid #ffffff66;background:transparent;color:#fff;font-weight:700;font-size:14px}
#lk-bar button.primary{background:#d9fdd3;color:#075e54;border-color:#d9fdd3}
.lk-prev{font-weight:700}
.lk-prev.ok{color:var(--primary)}
.lk-prev.bad{color:var(--destructive);font-weight:400}
.lk-bell.on{color:var(--primary);background:var(--soft-green);border-color:var(--primary)}
@media print{body{height:auto;overflow:visible;display:block}#root{display:block}#lk-bar,.lk-bell,[data-sonner-toaster],.shop-setting{display:none}#root>.app-shell{height:auto}}</style><style id="lk-skin">/* ===== لنا ولكم · v2.1 skin — "Ledger Premium": navy shell, gold accents, emerald/rose ledger colors ===== */
:root{
  color-scheme:light;
  --lk-navy:#0b1a2b;--lk-navy-2:#123253;--lk-navy-3:#1b4670;
  --lk-gold:#d4a72c;--lk-gold-2:#f3d27a;--lk-gold-ink:#8a6a12;
  --lk-emerald:#1d9a6c;--lk-emerald-ink:#0f5a3f;--lk-emerald-bg:#e3f5ec;
  --lk-rose:#d64545;--lk-rose-ink:#a12d2d;--lk-rose-bg:#fde8e8;
  --background:#ffffff;--foreground:#0f1f2e;--card:#ffffff;--card-foreground:#0f1f2e;
  --popover:#ffffff;--popover-foreground:#0f1f2e;
  --primary:#0f2a44;--primary-foreground:#ffffff;
  --secondary:#eef3f8;--secondary-foreground:#0f2a44;
  --muted:#f1f5f9;--muted-foreground:#5b6b7c;
  --accent:#e6f4ee;--accent-foreground:#0f5a3f;
  --destructive:#c0392b;--border:#dfe6ee;--input:#d5dee8;--ring:#d4a72c;--radius:1rem;
  --chat:#eef2f7;--bubble:#e3f5ec;--soft-green:#e6f4ee;--amber:#9a6700;--amber-bg:#fff4d6;--app-bg:#e6ebf2;
}
body{background:var(--app-bg);color:var(--foreground);letter-spacing:0}
.tabular,.balance-number,.message-value strong,.report-card dd,.amount-cell{font-variant-numeric:tabular-nums lining-nums}

/* ---------- app shell / header ---------- */
.app-shell{background:var(--background);border:0;box-shadow:0 20px 60px rgba(11,26,43,.12)}
@media (width>=1450px){#root>.app-shell{border-radius:24px}}
.app-header{background:linear-gradient(120deg,var(--lk-navy) 0%,var(--lk-navy-2) 70%,var(--lk-navy-3) 100%);color:#fff;border-bottom:0;min-height:74px;padding:12px 24px;position:relative}
.app-header::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--lk-gold) 30%,var(--lk-gold-2) 50%,var(--lk-gold) 70%,transparent)}
.brand-icon{background:linear-gradient(145deg,var(--lk-gold-2),var(--lk-gold));color:var(--lk-navy);border-radius:14px;width:46px;height:46px;box-shadow:0 6px 18px rgba(212,167,44,.35)}
.app-header .brand-lockup h1{color:#fff;font-weight:800;letter-spacing:-.3px}
.app-header .brand-lockup h1 .text-primary{color:var(--lk-gold-2)}
.app-header .brand-lockup .small{color:rgba(255,255,255,.7)}
.user-info{color:#fff}
.user-info span{color:rgba(255,255,255,.65)}
.icon-button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:12px;transition:background .15s}
.icon-button:hover{background:rgba(255,255,255,.16)}
.lk-bell.on{background:rgba(212,167,44,.22);border-color:var(--lk-gold);color:var(--lk-gold-2)}
.error-banner{background:var(--amber-bg);color:var(--amber);border-bottom:1px solid #f1d98c}

/* ---------- sidebar (desktop) ---------- */
.app-body{grid-template-columns:300px minmax(0,1fr)}
.account-panel{background:linear-gradient(180deg,var(--lk-navy-2) 0%,var(--lk-navy) 100%);color:#fff;border-inline-end:0;padding:24px 20px;gap:18px}
.shop-label{color:#fff;font-size:1.05rem}
.shop-label svg{color:var(--lk-gold-2)}
.shop-label span{color:rgba(255,255,255,.6)}
.account-summary{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px;backdrop-filter:blur(6px)}
.account-summary .balance-label{color:rgba(255,255,255,.65);font-size:.8rem;letter-spacing:.2px}
.balance-number{color:#fff;font-size:2rem;font-weight:800}
.balance-line small{color:var(--lk-gold-2);font-weight:700}
.account-summary hr{border-top:1px solid rgba(255,255,255,.12)}
.account-summary .fine-print{color:rgba(255,255,255,.5)}
.lk-dir{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.8rem}
.lk-dir.lana{background:rgba(29,154,108,.22);color:#8ff0c8}
.lk-dir.lakom{background:rgba(214,69,69,.22);color:#ffb3b3}
.lk-dir.even{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)}
.pending-box{color:var(--lk-gold-2);background:rgba(212,167,44,.1);border:1px solid rgba(212,167,44,.25);border-radius:16px;padding:12px 14px}
.pending-box strong{font-size:1.1rem}
.side-note{color:rgba(255,255,255,.55)}
.side-note strong{color:#fff}

/* ---------- tabs ---------- */
.top-tabs{background:var(--background)!important;border-bottom:1px solid var(--border);padding:10px 18px!important;gap:8px}
.top-tabs [data-slot=tabs-trigger]{border-radius:999px;padding:8px 18px;font-weight:700;color:var(--muted-foreground);background:var(--muted);border:1px solid transparent}
.top-tabs [data-state=active]{background:var(--primary)!important;color:#fff!important;box-shadow:0 6px 16px rgba(15,42,68,.25)!important}
.top-tabs [data-state=active] svg{color:var(--lk-gold-2)}

/* ---------- chat ---------- */
.chat-heading{background:var(--background);border-bottom:1px solid var(--border);padding:12px 22px}
.chat-heading h2{font-size:1.05rem;font-weight:800}
.chat-heading h2 .muted{color:var(--lk-gold)}
.sync-state{color:var(--lk-emerald);font-weight:600}
.mobile-balance{background:linear-gradient(120deg,var(--lk-navy),var(--lk-navy-2));color:#fff;border-bottom:0;padding:10px 16px;gap:10px 18px;font-weight:600}
.mobile-balance strong{color:var(--lk-gold-2);font-weight:800;font-size:1.05rem}
.mobile-balance .muted{color:rgba(255,255,255,.6)}
.pending-filter{font-weight:600}
.chat-scroll{background-color:var(--chat);background-image:radial-gradient(#d3dbe5 .9px,transparent .9px);background-size:20px 20px;padding:20px 26px}
.day-marker{background:var(--primary);color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:.75rem;box-shadow:0 4px 12px rgba(15,42,68,.2)}
.message{border:0;border-radius:20px 6px 20px 20px;box-shadow:0 8px 22px rgba(11,26,43,.08);padding:14px 18px 12px;background:var(--bubble)}
.other .message{background:#fff;border-radius:6px 20px 20px 20px}
.message-author{color:var(--primary);font-weight:800}
.message-number{color:var(--muted-foreground);font-weight:700;letter-spacing:.3px}
.message-value strong{font-size:1.9rem;font-weight:800;color:var(--foreground);line-height:1.3}

.direction-pill{border-radius:999px;padding:3px 12px;font-weight:800;font-size:.85rem;background:#fff;border:1px solid var(--border)}
.direction-pill.lana{background:var(--lk-emerald-bg);color:var(--lk-emerald-ink);border-color:#bfe7d3}
.direction-pill.lakom{background:var(--lk-rose-bg);color:var(--lk-rose-ink);border-color:#f3c4c4}
.message-note{background:rgba(15,42,68,.05);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:.95rem}
.other .message-note{background:#f1f5f9}
.message-party{color:var(--muted-foreground)}
.entry-status{border-radius:999px;padding:2px 10px;font-weight:700;font-size:.78rem;background:#fff;border:1px solid var(--border)}
.entry-status.confirmed{background:var(--lk-emerald-bg);color:var(--lk-emerald-ink);border-color:#bfe7d3}
.entry-status.pending{background:#fff4d6;color:var(--amber);border-color:#f1d98c}
.entry-status.rejected,.entry-status.cancelled{background:var(--lk-rose-bg);color:var(--lk-rose-ink);border-color:#f3c4c4}

.message-reason{border-top:1px dashed var(--border);color:var(--lk-rose-ink)}
.message-actions{gap:8px}

.message-actions [data-variant=default]{background:var(--lk-emerald);box-shadow:0 6px 14px rgba(29,154,108,.3)}
.message-actions [data-variant=default]:hover{background:var(--lk-emerald-ink)}
.message-actions [data-variant=outline]{border-color:var(--lk-rose);color:var(--lk-rose-ink);background:#fff}
.message-actions [data-variant=ghost]{color:var(--primary);background:rgba(15,42,68,.06)}
.empty-chat h3{font-weight:800}
.empty-chat svg{color:var(--lk-gold)}

/* ---------- composer ---------- */

.direction-choice:has([data-state=checked]){background:var(--lk-emerald-bg);border-color:var(--lk-emerald)}
.direction-choice:has(#dir-lakom[data-state=checked]){background:var(--lk-rose-bg);border-color:var(--lk-rose)}
.direction-choice [role=radio][data-state=checked]{border-color:currentColor}
.composer-fields{gap:10px}
.composer-fields label{font-weight:600;color:var(--muted-foreground)}
.composer input,.composer [data-slot=select-trigger]{background:#f3f6fa;border:1px solid var(--border);border-radius:12px;min-height:48px;font-weight:600}

/* ---------- team ---------- */
.member-card{background:#fff;border:0;border-radius:20px;box-shadow:0 10px 30px rgba(11,26,43,.08)}

/* ---------- login ---------- */
.welcome-page{background:radial-gradient(1200px 600px at 80% -10%,rgba(212,167,44,.18),transparent 60%),linear-gradient(160deg,var(--lk-navy) 0%,var(--lk-navy-2) 60%,var(--lk-navy-3) 100%);padding:28px 16px}

.welcome-card h2{color:var(--primary)}

.welcome-footer{color:rgba(255,255,255,.7)}
.subtle-link{color:var(--primary);font-weight:700}

/* ---------- dialogs / misc ---------- */
[data-slot=dialog-content],[data-slot=alert-dialog-content]{border-radius:22px;border:0;box-shadow:0 30px 80px rgba(11,26,43,.35)}
[data-slot=dialog-title],[data-slot=alert-dialog-title]{font-weight:800;color:var(--primary)}
.form-submit,[data-slot=alert-dialog-action]{font-weight:800}
.activation-code{background:#f3f6fa;border:1px dashed var(--lk-gold);color:var(--primary);font-weight:800}
#lk-bar{background:#08131f;border-bottom:1px solid rgba(212,167,44,.35)}
#lk-bar button.primary{background:var(--lk-gold);color:var(--lk-navy);border-color:var(--lk-gold)}
[data-sonner-toaster]{font-family:Cairo,Tahoma,Arial,sans-serif}

/* ---------- mobile ---------- */
@media (width<=760px){
  .app-header{padding:10px 14px;min-height:66px}
  .brand-icon{width:40px;height:40px;border-radius:12px}
  .top-tabs{padding:8px 10px!important}
  .top-tabs [data-slot=tabs-trigger]{padding:8px 10px;font-size:.85rem}
  .chat-scroll{padding:14px 12px}
  .message{padding:12px 14px 10px;border-radius:18px 6px 18px 18px}
  .other .message{border-radius:6px 18px 18px 18px}
  .message-value strong{font-size:1.6rem}
  .composer{padding:12px 12px max(14px,env(safe-area-inset-bottom))}
  .direction-choice{padding:9px 10px;border-radius:12px}
  .panel-scroll{padding:16px 12px}
  .report-card{padding:18px}
  .welcome-card{padding:28px 22px;border-radius:24px}
}
@media print{
  .app-header,.account-panel{display:none!important}
  .panel-scroll{background:#fff}
  .report-card,.report-table,.shop-setting{box-shadow:none;border:1px solid #ddd}
}

.lkc-composer textarea:focus{outline:0;border-color:var(--lk-gold);box-shadow:0 0 0 3px rgba(212,167,44,.22);background:#fff}
.lkc-send{flex-shrink:0;width:46px;height:46px;border:0;border-radius:14px;background:linear-gradient(145deg,var(--lk-gold-2),var(--lk-gold));color:var(--lk-navy);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 18px rgba(212,167,44,.35);transition:transform .1s,opacity .15s}
.lkc-send svg{transform:scaleX(-1)}
.lkc-send:disabled{opacity:.45;box-shadow:none;cursor:default}
.lkc-send:not(:disabled):active{transform:scale(.95)}

/* ---------- mobile ---------- */
@media (width<=900px){
  .lkc{grid-template-columns:1fr}
  .lkc-list{border-inline-end:0}
  .lkc.has-open .lkc-list{display:none}
  .lkc:not(.has-open) .lkc-conv{display:none}
  .lkc-back{display:grid}
  .lkc-scroll{padding:14px 12px 8px}
  .lkc-bubble{max-width:86%}
  .lkc-head{padding:8px 12px;min-height:58px}
  .lkc-composer{padding:10px 10px max(12px,env(safe-area-inset-bottom))}
  .lkc-jump{bottom:84px}
}

(function () {
  var bar = document.getElementById("lk-bar");
  var NS = "lana-lakom:";
  var LS = {
    get: function (k) { try { return localStorage.getItem(NS + k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(NS + k, String(v)); } catch (e) {} }

  function show(text, buttons) {
    if (!bar) return;
    bar.innerHTML = "";
    var span = document.createElement("span"); span.textContent = text; bar.appendChild(span);
    (buttons || []).forEach(function (b) {
      var el = document.createElement("button"); el.type = "button"; el.textContent = b.label;
      if (b.primary) el.className = "primary";
      if (b.aria) el.setAttribute("aria-label", b.aria);
      el.addEventListener("click", b.onClick); bar.appendChild(el);
    });
    bar.hidden = false;
  }
  function hide() { if (bar) { bar.hidden = true; bar.innerHTML = ""; } }

  var isHttps = location.protocol === "https:";
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;

  /* ---- install prompt (Android / desktop Chrome) and iOS hint ---- */
  if (isHttps && !standalone) {

    var dismiss = function () { LS.set("install-snooze", String(Date.now() + 7 * 864e5)); hide(); };
    var deferred = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault(); deferred = e;
      if (Date.now() < snooze) return;
      show("ثبّت «لنا ولكم» على جهازك كبرنامج", [
        { label: "تثبيت", primary: true, onClick: function () {
          if (!deferred) return;
          deferred.prompt();
          deferred.userChoice.then(function () { deferred = null; hide(); }).catch(hide);
        } },
        { label: "×", aria: "إغلاق", onClick: dismiss }
      ]);
    });
    var ua = navigator.userAgent;

        { label: "×", aria: "إغلاق", onClick: dismiss }
      ]);
    }
    window.addEventListener("appinstalled", hide);
  }

      });
    });
